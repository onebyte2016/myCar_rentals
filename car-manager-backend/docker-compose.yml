services:
  db:
    image: postgres:15

    environment:
      POSTGRES_DB: car_database
      POSTGRES_USER: onebyte
      POSTGRES_PASSWORD: ogbonna12345

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .

    command: >
      sh -c "python manage.py makemigrations &&
            python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            python manage.py runserver 0.0.0.0:8000"

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db

    env_file:
      - .env.dev

  frontend:
    build:
      context: ../car_rental_frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../car_rental_frontend/.env.production
    depends_on:
      - backend

volumes:
  postgres_data: